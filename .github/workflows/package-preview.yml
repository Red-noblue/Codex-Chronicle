# 中文说明：先冻结并验收候选，再选择同一份产物公开到不可变 Release；验证和公开步骤均不重新构建。
name: 验证与发布
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      operation:
        description: 构建、验证、公开观察版，或观察后推荐到自动更新
        required: true
        default: candidate
        type: choice
        options: [candidate, verify, publish, recommend]
      version:
        description: 固定目标版本，例如 0.1.0-preview.16；同一公开版本不允许替换
        required: true
        type: string
      candidate_run_id:
        description: 验证或公开时填写已成功的候选构建编号
        required: false
        type: string
      candidate_sha256:
        description: 验证或公开时填写冻结候选清单的 SHA-256
        required: false
        type: string
      immutable_releases_confirmed:
        description: 发布操作者已核验仓库不可变设置；建议使用本机 dispatch-publish 自动派发
        required: false
        default: false
        type: boolean
      observation_confirmed:
        description: 推荐时确认已完成实机或隔离观察验收；公开Release本身不会推进自动更新
        required: false
        default: false
        type: boolean
      observation_note:
        description: 推荐时填写观察结论，将保留在工作流与更新通道提交记录
        required: false
        type: string
      release_notes:
        description: 构建候选时可指定仓库内已审核的说明文件；正式版必须指定
        required: false
        type: string
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
jobs:
  test:
    name: 回归 / ${{ matrix.runner }}
    if: github.event_name != 'workflow_dispatch' || inputs.operation == 'candidate'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: 发布资产与渠道回归
        run: |
          python scripts/test-release-feed.py
          python scripts/test-release-candidate.py
      - name: Linux 桌面协议与原生窗口依赖
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y dbus-x11 zenity xvfb xauth xdotool desktop-file-utils at-spi2-core python3-pyatspi
      - name: Go 回归与静态检查
        shell: bash
        run: |
          go test ./...
          go vet ./...
      - name: Linux 安装卸载的更新进程保护
        if: runner.os == 'Linux'
        run: python3 scripts/test-linux-package-lifecycle.py
      - name: Unix 真实执行器的合成资产回归
        if: runner.os != 'Windows'
        run: python3 -m unittest discover -s docs/项目验证 -p test_authorized_live.py
      - name: 前端类型检查与生产构建
        working-directory: web
        shell: bash
        run: |
          npm ci
          npm test
          npm run check
          npm run build
      - name: 安装版端口冲突与设置恢复
        shell: bash
        run: |
          mkdir -p .local/port-check/bin
          suffix=""
          if [[ "$RUNNER_OS" == "Windows" ]]; then suffix=".exe"; fi
          go build -o ".local/port-check/bin/codex-chronicle${suffix}" ./cmd/codex-chronicle
          go build -o ".local/port-check/bin/codex-chronicle-desktop${suffix}" ./cmd/codex-chronicle-desktop
          cp -R web/dist .local/port-check/web
          python3 scripts/test-desktop-ports.py --package-root .local/port-check
      - name: 签名安装基线与真实升级回滚
        shell: bash
        env:
          CHRONICLE_TEST_LEGACY_REF: v0.1.0-preview.14
        run: |
          git fetch --no-tags --depth=1 origin tag "$CHRONICLE_TEST_LEGACY_REF"
          python3 scripts/test-installed-update.py
      - name: Linux D-Bus 托盘与端口设置窗口
        if: runner.os == 'Linux'
        run: |
          dbus-run-session -- go test -race -count=1 ./internal/desktopui/linuxtray
          dbus-run-session -- xvfb-run -a /usr/bin/python3 scripts/test-linux-desktop.py --launcher .local/port-check/bin/codex-chronicle-desktop
          desktop-file-validate packaging/linux/codex-chronicle.desktop
  release-config:
    name: 确定版本与更新渠道
    needs: test
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'candidate'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.config.outputs.version }}
      channel: ${{ steps.config.outputs.channel }}
      feed-url: ${{ steps.config.outputs.feed_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: 校验正式版本或预览版本
        id: config
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          chronicle_version="$INPUT_VERSION"
          python3 scripts/release-feed.py config "$chronicle_version" --repository "$GITHUB_REPOSITORY" >> "$GITHUB_OUTPUT"
  package:
    name: 安装包 / ${{ matrix.os }}-${{ matrix.arch }}
    needs: release-config
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'candidate'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            os: darwin
            arch: arm64
          - runner: macos-15-intel
            os: darwin
            arch: amd64
          - runner: windows-latest
            os: windows
            arch: amd64
          - runner: windows-11-arm
            os: windows
            arch: arm64
          - runner: ubuntu-latest
            os: linux
            arch: amd64
          - runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      CHRONICLE_BUILD_ID: ${{ github.sha }}
      CHRONICLE_ARCH: ${{ matrix.arch }}
      CHRONICLE_VERSION: ${{ needs.release-config.outputs.version }}
      CHRONICLE_UPDATE_FEED_URL: ${{ needs.release-config.outputs.feed-url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: 安装前端构建依赖
        working-directory: web
        run: npm ci
      - name: 准备注入发布签名私钥
        shell: bash
        env:
          CHRONICLE_UPDATE_SIGNING_KEY: ${{ secrets.CHRONICLE_UPDATE_SIGNING_KEY }}
          CHRONICLE_UPDATE_SIGNING_KEY_ID: ${{ secrets.CHRONICLE_UPDATE_SIGNING_KEY_ID }}
        run: |
          [[ -n "$CHRONICLE_UPDATE_SIGNING_KEY" ]] || { echo '缺少仓库 Secret：CHRONICLE_UPDATE_SIGNING_KEY' >&2; exit 1; }
          [[ -n "$CHRONICLE_UPDATE_SIGNING_KEY_ID" ]] || { echo '缺少仓库 Secret：CHRONICLE_UPDATE_SIGNING_KEY_ID' >&2; exit 1; }
          chronicle_signing_key="$RUNNER_TEMP/codex-chronicle-update-signing-key"
          printf '%s\n' "$CHRONICLE_UPDATE_SIGNING_KEY" > "$chronicle_signing_key"
          chmod 600 "$chronicle_signing_key"
          echo "CHRONICLE_SIGNING_PRIVATE_KEY_FILE=$chronicle_signing_key" >> "$GITHUB_ENV"
          echo "CHRONICLE_SIGNING_KEY_ID=$CHRONICLE_UPDATE_SIGNING_KEY_ID" >> "$GITHUB_ENV"
      - name: 核对发布密钥与固定公钥
        shell: bash
        run: |
          go run ./cmd/codex-chronicle-release key-info --output "$CHRONICLE_SIGNING_PRIVATE_KEY_FILE" > "$RUNNER_TEMP/chronicle-key-info.json"
          python3 - <<'PY'
          import json, os, pathlib
          info = json.loads((pathlib.Path(os.environ['RUNNER_TEMP']) / 'chronicle-key-info.json').read_text(encoding='utf-8'))
          public_keys = [line.strip() for line in pathlib.Path('packaging/update-signing.pub').read_text(encoding='utf-8').splitlines() if line.strip() and not line.lstrip().startswith('#')]
          if public_keys != [info['public_key']] or info['key_id'] != os.environ['CHRONICLE_SIGNING_KEY_ID']:
              raise SystemExit('发布私钥、Key ID 与仓库固定公钥不一致，停止构建')
          print('更新签名身份核验通过：' + info['key_id'])
          PY
      - name: 构建共同载荷与平台便携包
        shell: bash
        run: |
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || exit 1
          git diff --exit-code HEAD
          [[ -z "$(git ls-files --others --exclude-standard)" ]] || { echo '构建前出现未追踪源文件' >&2; exit 1; }
          [[ "$(go env GOOS)/$(go env GOARCH)" == '${{ matrix.os }}/${{ matrix.arch }}' ]] || { echo '发布包必须在匹配的原生运行器验收' >&2; exit 1; }
          bash scripts/build-release.sh "$CHRONICLE_VERSION" '${{ matrix.os }}' "$CHRONICLE_ARCH"
      - name: 生成 Windows 每用户安装器
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $env:CHRONICLE_PAYLOAD = Join-Path $env:GITHUB_WORKSPACE "dist/$env:CHRONICLE_VERSION/windows-$env:CHRONICLE_ARCH/payload"
          & "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe" packaging/windows/installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Windows 安装卸载与原生桌面验收
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $chronicleInstaller = Join-Path $env:GITHUB_WORKSPACE "dist/$env:CHRONICLE_VERSION/windows-$env:CHRONICLE_ARCH/Codex-Chronicle-$env:CHRONICLE_VERSION-$env:CHRONICLE_ARCH-Setup.exe"
          python scripts/test-windows-installer.py $chronicleInstaller $env:CHRONICLE_VERSION
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 生成 Linux DEB 与 RPM
        if: matrix.os == 'linux'
        shell: bash
        run: |
          export CHRONICLE_PAYLOAD="$GITHUB_WORKSPACE/dist/$CHRONICLE_VERSION/linux-$CHRONICLE_ARCH/payload"
          go run github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.43.4 package --config packaging/linux/nfpm.yaml --packager deb --target "dist/$CHRONICLE_VERSION/linux-$CHRONICLE_ARCH/Codex-Chronicle-$CHRONICLE_VERSION-linux-$CHRONICLE_ARCH.deb"
          go run github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.43.4 package --config packaging/linux/nfpm.yaml --packager rpm --target "dist/$CHRONICLE_VERSION/linux-$CHRONICLE_ARCH/Codex-Chronicle-$CHRONICLE_VERSION-linux-$CHRONICLE_ARCH.rpm"
      - name: 校验 Linux 安装包解包内容与启动
        if: matrix.os == 'linux'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libarchive-tools
          chronicle_extract="$(mktemp -d)"
          trap 'rm -rf "$chronicle_extract"' EXIT
          chronicle_packages="$GITHUB_WORKSPACE/dist/$CHRONICLE_VERSION/linux-$CHRONICLE_ARCH"
          mkdir "$chronicle_extract/deb" "$chronicle_extract/rpm"
          dpkg-deb -x "$chronicle_packages/"*.deb "$chronicle_extract/deb"
          bsdtar --no-same-owner -xf "$chronicle_packages/"*.rpm -C "$chronicle_extract/rpm" -s ',^/,,'
          for chronicle_format in deb rpm; do
            python3 scripts/verify-linux-package.py "$chronicle_extract/$chronicle_format/usr/lib/codex-chronicle" "$CHRONICLE_VERSION" "$CHRONICLE_ARCH"
          done
      - name: 汇总全部安装包摘要
        shell: bash
        env:
          CHRONICLE_TARGET_OS: ${{ matrix.os }}
        run: |
          python - <<'PY'
          import hashlib, os, pathlib
          root = pathlib.Path('dist') / os.environ['CHRONICLE_VERSION'] / (os.environ['CHRONICLE_TARGET_OS'] + '-' + os.environ['CHRONICLE_ARCH'])
          packages = sorted(p for p in root.iterdir() if p.is_file() and (p.suffix in {'.zip', '.dmg', '.exe', '.deb', '.rpm'} or p.name.endswith('.tar.gz')))
          with (root / 'SHA256SUMS').open('w', encoding='utf-8') as result:
              for package in packages:
                  with package.open('rb') as source:
                      result.write(hashlib.file_digest(source, 'sha256').hexdigest() + '  ' + package.name + '\n')
          PY
      - name: 上传安装包
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Codex-Chronicle-${{ matrix.os }}-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            dist/${{ env.CHRONICLE_VERSION }}/${{ matrix.os }}-${{ matrix.arch }}/*.zip
            dist/${{ env.CHRONICLE_VERSION }}/${{ matrix.os }}-${{ matrix.arch }}/*.tar.gz
            dist/${{ env.CHRONICLE_VERSION }}/${{ matrix.os }}-${{ matrix.arch }}/*.dmg
            dist/${{ env.CHRONICLE_VERSION }}/${{ matrix.os }}-${{ matrix.arch }}/*.exe
            dist/${{ env.CHRONICLE_VERSION }}/${{ matrix.os }}-${{ matrix.arch }}/*.deb
            dist/${{ env.CHRONICLE_VERSION }}/${{ matrix.os }}-${{ matrix.arch }}/*.rpm
            dist/${{ env.CHRONICLE_VERSION }}/${{ matrix.os }}-${{ matrix.arch }}/SHA256SUMS
      - name: 清理发布签名私钥
        if: always()
        shell: bash
        run: |
          if [[ -n "${CHRONICLE_SIGNING_PRIVATE_KEY_FILE:-}" ]]; then
            rm -f -- "$CHRONICLE_SIGNING_PRIVATE_KEY_FILE"
          fi
  seal:
    name: 冻结候选与构建来源
    needs: [release-config, package]
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'candidate'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    env:
      CHRONICLE_VERSION: ${{ needs.release-config.outputs.version }}
      CHRONICLE_NOTES: ${{ inputs.release_notes }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: Codex-Chronicle-*
          path: release-assets
      - name: 冻结最终安装包与发布说明
        id: freeze
        shell: bash
        run: |
          python3 scripts/release-feed.py assemble "$CHRONICLE_VERSION" --repository "$GITHUB_REPOSITORY"
          chronicle_notes=()
          if [[ -n "$CHRONICLE_NOTES" ]]; then chronicle_notes=(--notes-file "$CHRONICLE_NOTES"); fi
          python3 scripts/release-candidate.py seal --version "$CHRONICLE_VERSION" --repository "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" "${chronicle_notes[@]}" | tee "$RUNNER_TEMP/candidate-digest"
          cat "$RUNNER_TEMP/candidate-digest" >> "$GITHUB_OUTPUT"
          {
            echo '### 已冻结发布候选'
            echo "版本：\`$CHRONICLE_VERSION\`"
            echo "源码：\`$GITHUB_SHA\`"
            echo "构建编号：\`$GITHUB_RUN_ID\`，尝试：\`$GITHUB_RUN_ATTEMPT\`"
            echo "清单摘要：\`$(cut -d= -f2 "$RUNNER_TEMP/candidate-digest")\`"
            echo '正式发布必须选择本次冻结产物，并再次验证构建来源。'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: 生成构建来源证明
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: publish/*
      - name: 保存不可覆盖的冻结候选
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Codex-Chronicle-candidate-${{ env.CHRONICLE_VERSION }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
          path: publish/*
  inspect:
    name: 验证已验收候选
    if: github.event_name == 'workflow_dispatch' && (inputs.operation == 'verify' || inputs.operation == 'publish' || inputs.operation == 'recommend')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      attestations: read
    outputs:
      artifact-id: ${{ steps.selection.outputs.artifact_id }}
      channel: ${{ steps.config.outputs.channel }}
      source-commit: ${{ steps.selection.outputs.source_commit }}
    env:
      GH_TOKEN: ${{ github.token }}
      CHRONICLE_VERSION: ${{ inputs.version }}
      CHRONICLE_SOURCE_RUN: ${{ inputs.candidate_run_id }}
      CHRONICLE_CANDIDATE_SHA: ${{ inputs.candidate_sha256 }}
      CHRONICLE_OPERATION: ${{ inputs.operation }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: 绑定成功构建与唯一冻结产物
        id: selection
        shell: bash
        run: |
          [[ "$CHRONICLE_CANDIDATE_SHA" =~ ^[0-9a-f]{64}$ ]] || { echo '必须指定已验收候选清单的 SHA-256' >&2; exit 1; }
          chronicle_publish=()
          if [[ "$CHRONICLE_OPERATION" == publish || "$CHRONICLE_OPERATION" == recommend ]]; then
            [[ "$GITHUB_REF" == refs/heads/main ]] || { echo '公开发布只能从 main 执行' >&2; exit 1; }
            chronicle_publish=(--for-publish)
          fi
          python3 scripts/release-candidate.py select --run-id "$CHRONICLE_SOURCE_RUN" --version "$CHRONICLE_VERSION" --repository "$GITHUB_REPOSITORY" --selection "$RUNNER_TEMP/selection.json" "${chronicle_publish[@]}" >> "$GITHUB_OUTPUT"
      - name: 确定固定更新通道
        id: config
        run: python3 scripts/release-feed.py config "$CHRONICLE_VERSION" --repository "$GITHUB_REPOSITORY" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ steps.selection.outputs.artifact_id }}
          github-token: ${{ github.token }}
          run-id: ${{ inputs.candidate_run_id }}
          repository: ${{ github.repository }}
          merge-multiple: true
          path: candidate
      - name: 验证冻结字节和 OIDC 构建身份
        run: python3 scripts/release-candidate.py verify --root candidate --version "$CHRONICLE_VERSION" --repository "$GITHUB_REPOSITORY" --expected-sha256 "$CHRONICLE_CANDIDATE_SHA" --selection "$RUNNER_TEMP/selection.json" --attestation
  release:
    name: 推广同一候选到不可变 Release
    needs: inspect
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'publish' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: chronicle-public-release
      cancel-in-progress: false
    environment: release
    permissions:
      contents: write
      actions: read
      attestations: read
    env:
      GH_TOKEN: ${{ github.token }}
      CHRONICLE_VERSION: ${{ inputs.version }}
      CHRONICLE_SOURCE_RUN: ${{ inputs.candidate_run_id }}
      CHRONICLE_CANDIDATE_SHA: ${{ inputs.candidate_sha256 }}
      CHRONICLE_IMMUTABLE_RELEASES_CONFIRMED: ${{ inputs.immutable_releases_confirmed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: 重新绑定所选验收记录
        run: python3 scripts/release-candidate.py select --run-id "$CHRONICLE_SOURCE_RUN" --version "$CHRONICLE_VERSION" --repository "$GITHUB_REPOSITORY" --selection "$RUNNER_TEMP/selection.json" --for-publish
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.inspect.outputs.artifact-id }}
          github-token: ${{ github.token }}
          run-id: ${{ inputs.candidate_run_id }}
          repository: ${{ github.repository }}
          merge-multiple: true
          path: candidate
      - name: 只上传缺失资产并公开同一份候选
        run: python3 scripts/release-candidate.py publish --root candidate --version "$CHRONICLE_VERSION" --repository "$GITHUB_REPOSITORY" --expected-sha256 "$CHRONICLE_CANDIDATE_SHA" --selection "$RUNNER_TEMP/selection.json"
  update-channel:
    name: 观察验收后推荐到静态版本通道
    needs: inspect
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'recommend' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: chronicle-update-feeds
      cancel-in-progress: false
    environment: release
    permissions:
      contents: write
      actions: read
      attestations: read
    env:
      GH_TOKEN: ${{ github.token }}
      CHRONICLE_VERSION: ${{ inputs.version }}
      CHRONICLE_CHANNEL: ${{ needs.inspect.outputs.channel }}
      CHRONICLE_SOURCE_RUN: ${{ inputs.candidate_run_id }}
      CHRONICLE_CANDIDATE_SHA: ${{ inputs.candidate_sha256 }}
      CHRONICLE_OBSERVATION_CONFIRMED: ${{ inputs.observation_confirmed }}
      CHRONICLE_OBSERVATION_NOTE: ${{ inputs.observation_note }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: 要求明确的观察确认
        shell: bash
        run: |
          [[ "$CHRONICLE_OBSERVATION_CONFIRMED" == true && -n "$CHRONICLE_OBSERVATION_NOTE" ]] || { echo '先完成观察验收并填写结论，再推荐自动更新' >&2; exit 1; }
      - name: 重新绑定同一候选
        run: python3 scripts/release-candidate.py select --run-id "$CHRONICLE_SOURCE_RUN" --version "$CHRONICLE_VERSION" --repository "$GITHUB_REPOSITORY" --selection "$RUNNER_TEMP/selection.json" --for-publish
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.inspect.outputs.artifact-id }}
          github-token: ${{ github.token }}
          run-id: ${{ inputs.candidate_run_id }}
          repository: ${{ github.repository }}
          merge-multiple: true
          path: candidate
      - name: 核验公开资产仍与观察候选完全一致
        run: python3 scripts/release-candidate.py recommend --root candidate --version "$CHRONICLE_VERSION" --repository "$GITHUB_REPOSITORY" --expected-sha256 "$CHRONICLE_CANDIDATE_SHA" --selection "$RUNNER_TEMP/selection.json" --observation-confirmed --observation-note "$CHRONICLE_OBSERVATION_NOTE"
      - name: 原子推进已公开版本的静态索引
        shell: bash
        run: |
          chronicle_channel="$(mktemp -d)"
          chronicle_feed="$(mktemp -d)"
          trap 'rm -rf -- "$chronicle_channel" "$chronicle_feed"' EXIT
          gh release download "v$CHRONICLE_VERSION" --pattern codex-chronicle-feed.json --dir "$chronicle_feed"
          git -C "$chronicle_channel" init -q -b update-feeds
          git -C "$chronicle_channel" remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          if git -C "$chronicle_channel" ls-remote --exit-code --heads origin refs/heads/update-feeds > "$RUNNER_TEMP/chronicle-channel-ref"; then
            git -C "$chronicle_channel" fetch -q --depth=1 origin refs/heads/update-feeds
            git -C "$chronicle_channel" checkout -q -B update-feeds FETCH_HEAD
          else
            chronicle_status=$?
            [[ "$chronicle_status" == 2 ]] || exit "$chronicle_status"
          fi
          [[ "$CHRONICLE_CHANNEL" == preview || "$CHRONICLE_CHANNEL" == stable ]] || exit 1
          python3 scripts/release-feed.py promote-channel "$CHRONICLE_VERSION" --repository "$GITHUB_REPOSITORY" --feed-json "$chronicle_feed/codex-chronicle-feed.json" --output "$chronicle_channel/$CHRONICLE_CHANNEL.json"
          git -C "$chronicle_channel" add -- "$CHRONICLE_CHANNEL.json"
          if git -C "$chronicle_channel" diff --cached --quiet; then
            echo '静态版本通道已是相同或更新版本'
            exit 0
          fi
          git -C "$chronicle_channel" -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "更新 $CHRONICLE_CHANNEL 通道到 $CHRONICLE_VERSION" -m "$CHRONICLE_OBSERVATION_NOTE"
          git -C "$chronicle_channel" -c credential.helper= -c 'credential.helper=!gh auth git-credential' push origin HEAD:refs/heads/update-feeds
