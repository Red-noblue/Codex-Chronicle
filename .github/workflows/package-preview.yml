# 中文说明：公开源码的跨平台回归与预览包构建；只有版本标签且所有检查成功才发布，不访问用户 Codex 数据。
name: 验证与发布预览版
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 仅构建测试包的预览版本，例如 0.1.0-preview.11
        required: true
        type: string
permissions:
  contents: read
jobs:
  test:
    name: 回归 / ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Go 回归与静态检查
        shell: bash
        run: |
          go test ./...
          go vet ./...
      - name: Unix 真实执行器的合成资产回归
        if: runner.os != 'Windows'
        run: python3 -m unittest discover -s docs/项目验证 -p test_authorized_live.py
      - name: 前端类型检查与生产构建
        working-directory: web
        shell: bash
        run: |
          npm ci
          npm test
          npm run check
          npm run build
  package:
    name: 安装包 / ${{ matrix.os }}-${{ matrix.arch }}
    needs: test
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            os: darwin
            arch: arm64
          - runner: macos-15-intel
            os: darwin
            arch: amd64
          - runner: windows-latest
            os: windows
            arch: amd64
          - runner: windows-11-arm
            os: windows
            arch: arm64
          - runner: ubuntu-latest
            os: linux
            arch: amd64
          - runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      CHRONICLE_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - name: 从标签或手动输入确定版本
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            CHRONICLE_VERSION="${GITHUB_REF#refs/tags/v}"
          else
            CHRONICLE_VERSION="$INPUT_VERSION"
          fi
          [[ "$CHRONICLE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-preview\.[0-9]+$ ]] || { echo '此工作流仅发布 preview 版本'; exit 1; }
          echo "CHRONICLE_VERSION=$CHRONICLE_VERSION" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: 安装前端构建依赖
        working-directory: web
        run: npm ci
      - name: 构建共同载荷与平台便携包
        shell: bash
        run: bash scripts/build-release.sh "$CHRONICLE_VERSION" '${{ matrix.os }}' "$CHRONICLE_ARCH"
      - name: 生成 Windows 每用户安装器
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $env:CHRONICLE_PAYLOAD = Join-Path $env:GITHUB_WORKSPACE "dist/$env:CHRONICLE_VERSION/windows-$env:CHRONICLE_ARCH/payload"
          & "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe" packaging/windows/installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 生成 Linux DEB 与 RPM
        if: matrix.os == 'linux'
        shell: bash
        run: |
          export CHRONICLE_PAYLOAD="$GITHUB_WORKSPACE/dist/$CHRONICLE_VERSION/linux-$CHRONICLE_ARCH/payload"
          go run github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.43.4 package --config packaging/linux/nfpm.yaml --packager deb --target "dist/$CHRONICLE_VERSION/linux-$CHRONICLE_ARCH/Codex-Chronicle-$CHRONICLE_VERSION-linux-$CHRONICLE_ARCH.deb"
          go run github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.43.4 package --config packaging/linux/nfpm.yaml --packager rpm --target "dist/$CHRONICLE_VERSION/linux-$CHRONICLE_ARCH/Codex-Chronicle-$CHRONICLE_VERSION-linux-$CHRONICLE_ARCH.rpm"
      - name: 校验 Linux 安装包解包内容与启动
        if: matrix.os == 'linux'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libarchive-tools
          chronicle_extract="$(mktemp -d)"
          trap 'rm -rf "$chronicle_extract"' EXIT
          chronicle_packages="$GITHUB_WORKSPACE/dist/$CHRONICLE_VERSION/linux-$CHRONICLE_ARCH"
          mkdir "$chronicle_extract/deb" "$chronicle_extract/rpm"
          dpkg-deb -x "$chronicle_packages/"*.deb "$chronicle_extract/deb"
          bsdtar --no-same-owner -xf "$chronicle_packages/"*.rpm -C "$chronicle_extract/rpm" -s ',^/,,'
          for chronicle_format in deb rpm; do
            python3 scripts/verify-linux-package.py "$chronicle_extract/$chronicle_format/usr/lib/codex-chronicle" "$CHRONICLE_VERSION" "$CHRONICLE_ARCH"
          done
      - name: 汇总全部安装包摘要
        shell: bash
        env:
          CHRONICLE_TARGET_OS: ${{ matrix.os }}
        run: |
          python - <<'PY'
          import hashlib, os, pathlib
          root = pathlib.Path('dist') / os.environ['CHRONICLE_VERSION'] / (os.environ['CHRONICLE_TARGET_OS'] + '-' + os.environ['CHRONICLE_ARCH'])
          packages = sorted(p for p in root.iterdir() if p.is_file() and (p.suffix in {'.zip', '.dmg', '.exe', '.deb', '.rpm'} or p.name.endswith('.tar.gz')))
          with (root / 'SHA256SUMS').open('w', encoding='utf-8') as result:
              for package in packages:
                  with package.open('rb') as source:
                      result.write(hashlib.file_digest(source, 'sha256').hexdigest() + '  ' + package.name + '\n')
          PY
      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: Codex-Chronicle-${{ matrix.os }}-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            dist/${{ env.CHRONICLE_VERSION }}/${{ matrix.os }}-${{ matrix.arch }}/*.zip
            dist/${{ env.CHRONICLE_VERSION }}/${{ matrix.os }}-${{ matrix.arch }}/*.tar.gz
            dist/${{ env.CHRONICLE_VERSION }}/${{ matrix.os }}-${{ matrix.arch }}/*.dmg
            dist/${{ env.CHRONICLE_VERSION }}/${{ matrix.os }}-${{ matrix.arch }}/*.exe
            dist/${{ env.CHRONICLE_VERSION }}/${{ matrix.os }}-${{ matrix.arch }}/*.deb
            dist/${{ env.CHRONICLE_VERSION }}/${{ matrix.os }}-${{ matrix.arch }}/*.rpm
            dist/${{ env.CHRONICLE_VERSION }}/${{ matrix.os }}-${{ matrix.arch }}/SHA256SUMS
  release:
    name: 发布公开预览版
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: Codex-Chronicle-*
          path: release-assets
      - name: 核对摘要并准备发布资产
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, shutil
          target = pathlib.Path('publish')
          target.mkdir()
          combined = []
          for sums in sorted(pathlib.Path('release-assets').glob('*/SHA256SUMS')):
              for line in sums.read_text().splitlines():
                  expected, name = line.split('  ', 1)
                  source = sums.parent / name
                  with source.open('rb') as handle:
                      assert hashlib.file_digest(handle, 'sha256').hexdigest() == expected, name
                  assert not (target / name).exists(), name
                  shutil.copy2(source, target / name)
                  combined.append(line)
          assert len(combined) == 16, f'预计 16 个安装包，实际 {len(combined)}'
          (target / 'SHA256SUMS').write_text('\n'.join(sorted(combined)) + '\n')
          PY
      - name: 创建预览 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" publish/* --verify-tag --prerelease --latest=false --title "Codex Chronicle ${GITHUB_REF_NAME#v} · 首发预览版" --notes-file packaging/预览版说明.md
